name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add wasm32-wasip2 target
      run: rustup target add wasm32-wasip2
    - name: Build
      run: cargo build --target=wasm32-wasip2 --release
    - name: Setup `wasmtime`
      uses: bytecodealliance/actions/wasmtime/setup@v1
    - name: Run wasm component
      run: |
        mkdir -p artifacts
        wasmtime run --invoke 'generate("# Test document\n\nThis is a generated PDF.")' target/wasm32-wasip2/release/wasi_component_md_pdf.wasm > artifacts/generated.pdf
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: generated-pdf
        path: artifacts/generated.pdf

